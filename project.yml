name: GlassesStream
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "16"

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.1"

targets:
  GlassesStream:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources:
      - GlassesStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.glassesstream
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: GlassesStream/Info.plist
    info:
      path: GlassesStream/Info.plist
      properties:
        CFBundleName: GlassesStream
        CFBundleDisplayName: GlassesStream
        CFBundleIdentifier: com.local.glassesstream
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Required to connect to Ray-Ban Meta glasses via Bluetooth."
        NSLocalNetworkUsageDescription: "Required to serve the MJPEG stream on your local network."
        NSCameraUsageDescription: "The glasses camera feed is displayed and streamed from the app."
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
